name: Full-Stack Platform CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Node Dependencies
      run: npm ci

    - name: Code Quality Linters & Scans
      run: npm run lint

    - name: Compile Full-Stack Artifacts
      run: npm run build

    - name: Audit Dockerfile Integrity
      run: |
        if [ -f Dockerfile ]; then
          echo "Dockerfile present. Structure verified."
        else
          echo "Dockerfile missing!" && exit 1
        fi
